<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execicio Form 1</title>
</head>
<body>
    <h1>Deixe um Comentário</h1>
    <form>
    <label>Nome:</label>
    <input type="text" placeholder="Seu Nome" name="nome" required>
    <br><br>
    <label>Email:</label>
    <input type="email" placeholder="Seu Email" name="email" required>
    <br><br>
    <label>Website:</label>
    <input type="url" placeholder="Seu Website" name="website">
    <br><br>
    <label>Comentário:</label>
    <textarea placeholder="Seu Comentário" name="comentario" required></textarea>
    </form>
    <p>Observação: Seu comentário irá ser publicado após passar pelo moderador.</p>
    <br><br>
    <button type="submit" form="form ">Enviar Comentário</button>
    <button type="reset" form="form">Limpar Campos</button>
</body>
</html>
